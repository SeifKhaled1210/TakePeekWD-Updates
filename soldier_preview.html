.col { display: flex; flex-direction: column; align-items: center; }
</style>
<div class="col">
  <canvas id="c1" width="160" height="400"></canvas>
  <div class="label">1x (160x400)</div>
</div>

  <div class="label">2x scaled</div>

  <div class="label">0.5x (menu size)</div>
</div>
<script>
function blend(imgData, x, y, r, g, b, a) {
  if (x < 0 || x >= imgData.width || y < 0 || y >= imgData.height || a <= 0) return;
  if (a > 1) a = 1;
  const i = (y * imgData.width + x) * 4;
  const d = imgData.data;
  const da = d[i+3] / 255;
  const oa = a + da * (1-a);
  if (oa > 0.001) {
    d[i] = (r*a + d[i]*da*(1-a)) / oa;
    d[i+1] = (g*a + d[i+1]*da*(1-a)) / oa;
    d[i+2] = (b*a + d[i+2]*da*(1-a)) / oa;
  }
  d[i+3] = oa * 255;
}

function ellipse(img, cx, cy, rx, ry, r, g, b, alpha=1) {
  const x0 = Math.max(0, Math.floor(cx-rx-1.5));
  const x1 = Math.min(img.width-1, Math.ceil(cx+rx+1.5));
  const y0 = Math.max(0, Math.floor(cy-ry-1.5));
  const y1 = Math.min(img.height-1, Math.ceil(cy+ry+1.5));
  for (let py=y0;py<=y1;py++) for (let px=x0;px<=x1;px++) {
    const dx=(px-cx)/rx, dy=(py-cy)/ry, d2=dx*dx+dy*dy;
    if (d2<1.2) {
      let aa = d2>0.82 ? (1-(d2-0.82)/0.38) : 1;
      if (aa>0) blend(img,px,py,r,g,b,aa*alpha);
    }
  }
}

function rect(img, x0, y0, x1, y1, r, g, b, alpha=1, rad=0) {
  const ix0=Math.floor(x0-1), ix1=Math.ceil(x1+1), iy0=Math.floor(y0-1), iy1=Math.ceil(y1+1);
  for (let py=iy0;py<=iy1;py++) for (let px=ix0;px<=ix1;px++) {
    let aa=1;
    if (rad>0) {
      let cx2 = px<x0+rad ? x0+rad : px>x1-rad ? x1-rad : px;
      let cy2 = py<y0+rad ? y0+rad : py>y1-rad ? y1-rad : py;
      let d = Math.sqrt((px-cx2)**2+(py-cy2)**2);
      if (d>rad+0.7) continue;
      if (d>rad-0.7) aa=(rad+0.7-d)/1.4;
    } else {
      if (px<x0-0.5||px>x1+0.5||py<y0-0.5||py>y1+0.5) continue;
      if (px<x0+0.5) aa*=px-x0+0.5;
      if (px>x1-0.5) aa*=x1-px+0.5;
      if (py<y0+0.5) aa*=py-y0+0.5;
      if (py>y1-0.5) aa*=y1-py+0.5;
    }
    if (aa>0) blend(img,px,py,r,g,b,aa*alpha);
  }
}

function trap(img, topY, botY, topL, topR, botL, botR, r, g, b, alpha=1) {
  const iy0=Math.floor(topY-1), iy1=Math.ceil(botY+1);
  for (let py=iy0;py<=iy1;py++) {
    let t=(py-topY)/(botY-topY);
    if (t<-0.01||t>1.01) continue;
    t=Math.max(0,Math.min(1,t));
    const xl=topL+(botL-topL)*t, xr=topR+(botR-topR)*t;
    let yaa=1;
    if (py<topY+0.5) yaa=py-topY+0.5;
    if (py>botY-0.5) yaa=botY-py+0.5;
    if (yaa<=0) continue;
    for (let px=Math.floor(xl-1);px<=Math.ceil(xr+1);px++) {
      let xaa=1;
      if (px<xl+0.5) xaa=px-xl+0.5;
      if (px>xr-0.5) xaa*=xr-px+0.5;
      if (xaa>0) blend(img,px,py,r,g,b,xaa*yaa*alpha);
    }
  }
}

function drawSoldier(ctx) {
  const W=160,H=400;
  const img = ctx.createImageData(W,H);
  const cx=W*0.5;
  const gMain={r:72,g:78,b:65}, gDark={r:48,g:52,b:44}, gLight={r:92,g:98,b:82};

  const gMask={r:55,g:50,b:45}, gGoggle={r:28,g:32,b:40};
  const gWeapon={r:45,g:42,b:38}, gWepLt={r:65,g:60,b:55}, shadow={r:20,g:22,b:18};

  // LEGS
  trap(img,190,268,cx-22,cx-6,cx-20,cx-8,gMain.r,gMain.g,gMain.b);
  ellipse(img,cx-14,192,10,6,gMain.r,gMain.g,gMain.b);
  trap(img,190,268,cx+6,cx+22,cx+8,cx+20,gMain.r,gMain.g,gMain.b);
  ellipse(img,cx+14,192,10,6,gMain.r,gMain.g,gMain.b);
  trap(img,196,260,cx-20,cx-9,cx-18,cx-10,gLight.r,gLight.g,gLight.b,0.3);
  trap(img,196,260,cx+9,cx+20,cx+10,cx+18,gLight.r,gLight.g,gLight.b,0.3);
  rect(img,cx-22,220,cx-12,240,gDark.r,gDark.g,gDark.b,0.6,2);
  rect(img,cx+12,220,cx+22,240,gDark.r,gDark.g,gDark.b,0.6,2);
  // Knee pads
  ellipse(img,cx-14,268,10,8,gDark.r,gDark.g,gDark.b);
  ellipse(img,cx+14,268,10,8,gDark.r,gDark.g,gDark.b);
  ellipse(img,cx-14,267,8,6,gMain.r,gMain.g,gMain.b,0.7);
  ellipse(img,cx+14,267,8,6,gMain.r,gMain.g,gMain.b,0.7);
  // Calves
  trap(img,274,340,cx-19,cx-7,cx-17,cx-9,gMain.r,gMain.g,gMain.b);
  trap(img,274,340,cx+7,cx+19,cx+9,cx+17,gMain.r,gMain.g,gMain.b);
  trap(img,278,336,cx-17,cx-9,cx-15,cx-11,gLight.r,gLight.g,gLight.b,0.25);
  trap(img,278,336,cx+9,cx+17,cx+11,cx+15,gLight.r,gLight.g,gLight.b,0.25);
  // Boots
  rect(img,cx-20,336,cx-4,358,gBoot.r,gBoot.g,gBoot.b,1,3);
  rect(img,cx+4,336,cx+20,358,gBoot.r,gBoot.g,gBoot.b,1,3);
  rect(img,cx-21,352,cx-3,362,shadow.r,shadow.g,shadow.b,0.9,2);
  rect(img,cx+3,352,cx+21,362,shadow.r,shadow.g,shadow.b,0.9,2);
  for (let i=0;i<3;i++) {
    const ly=340+i*5;
    rect(img,cx-18,ly,cx-6,ly+1.5,shadow.r,shadow.g,shadow.b,0.4);
    rect(img,cx+6,ly,cx+18,ly+1.5,shadow.r,shadow.g,shadow.b,0.4);
  }
  // TORSO
  trap(img,74,130,cx-36,cx+36,cx-30,cx+30,gMain.r,gMain.g,gMain.b);
  trap(img,130,188,cx-30,cx+30,cx-22,cx+22,gMain.r,gMain.g,gMain.b);
  trap(img,80,125,cx-10,cx+10,cx-8,cx+8,gLight.r,gLight.g,gLight.b,0.2);
  trap(img,78,185,cx-36,cx-28,cx-24,cx-18,shadow.r,shadow.g,shadow.b,0.25);
  trap(img,78,185,cx+28,cx+36,cx+18,cx+24,shadow.r,shadow.g,shadow.b,0.25);
  // PLATE CARRIER
  rect(img,cx-24,80,cx+24,170,gVest.r,gVest.g,gVest.b,0.85,4);
  trap(img,72,90,cx-24,cx-14,cx-22,cx-14,gVest.r,gVest.g,gVest.b,0.9);
  trap(img,72,90,cx+14,cx+24,cx+14,cx+22,gVest.r,gVest.g,gVest.b,0.9);
  rect(img,cx-20,100,cx+20,160,gDark.r,gDark.g,gDark.b,0.35,3);
  for (let i=0;i<5;i++) { const wy=104+i*12; rect(img,cx-18,wy,cx+18,wy+1.2,shadow.r,shadow.g,shadow.b,0.3); }
  for (let i=-1;i<=1;i++) {
    const px=cx+i*14-5;
    rect(img,px,145,px+11,168,gDark.r,gDark.g,gDark.b,0.8,2);
    rect(img,px+1,146,px+10,148,shadow.r,shadow.g,shadow.b,0.5);
    rect(img,px+2,146,px+9,152,gWeapon.r,gWeapon.g,gWeapon.b,0.5,1);
  }
  rect(img,cx-34,88,cx-24,155,gDark.r,gDark.g,gDark.b,0.5,2);
  rect(img,cx+24,88,cx+34,155,gDark.r,gDark.g,gDark.b,0.5,2);
  rect(img,cx-10,82,cx+10,98,gDark.r,gDark.g,gDark.b,0.5,2);
  // Belt
  rect(img,cx-26,178,cx+26,192,gDark.r,gDark.g,gDark.b,0.8,2);
  rect(img,cx-4,180,cx+4,190,gWepLt.r,gWepLt.g,gWepLt.b,0.6,1);
  rect(img,cx+20,180,cx+32,210,gDark.r,gDark.g,gDark.b,0.7,2);
  rect(img,cx+22,182,cx+30,198,gWeapon.r,gWeapon.g,gWeapon.b,0.5,1);
  // ARMS
  trap(img,76,138,cx-48,cx-34,cx-44,cx-30,gMain.r,gMain.g,gMain.b);
  trap(img,80,134,cx-46,cx-37,cx-42,cx-33,gLight.r,gLight.g,gLight.b,0.2);
  ellipse(img,cx-37,138,9,7,gDark.r,gDark.g,gDark.b,0.8);
  trap(img,142,200,cx-43,cx-30,cx-40,cx-28,gMain.r,gMain.g,gMain.b);
  trap(img,146,196,cx-41,cx-33,cx-38,cx-30,gLight.r,gLight.g,gLight.b,0.2);
  ellipse(img,cx-34,202,8,6,gDark.r,gDark.g,gDark.b);
  trap(img,76,138,cx+34,cx+48,cx+30,cx+44,gMain.r,gMain.g,gMain.b);
  trap(img,80,134,cx+37,cx+46,cx+33,cx+42,gLight.r,gLight.g,gLight.b,0.2);
  ellipse(img,cx+37,138,9,7,gDark.r,gDark.g,gDark.b,0.8);
  trap(img,142,200,cx+30,cx+43,cx+28,cx+40,gMain.r,gMain.g,gMain.b);
  trap(img,146,196,cx+33,cx+41,cx+30,cx+38,gLight.r,gLight.g,gLight.b,0.2);
  ellipse(img,cx+34,202,8,6,gDark.r,gDark.g,gDark.b);
  rect(img,cx-46,86,cx-36,100,gDark.r+15,gDark.g+10,gDark.b,0.4,1);
  // WEAPON
  trap(img,130,138,cx-50,cx-44,cx+30,cx+36,gWeapon.r,gWeapon.g,gWeapon.b,0.85);
  rect(img,cx-10,126,cx+18,142,gWeapon.r,gWeapon.g,gWeapon.b,0.8,2);
  trap(img,128,142,cx+16,cx+22,cx+38,cx+44,gWeapon.r,gWeapon.g,gWeapon.b,0.75);
  rect(img,cx-2,140,cx+8,162,gWeapon.r,gWeapon.g,gWeapon.b,0.7,1);
  rect(img,cx-52,131,cx-46,137,shadow.r,shadow.g,shadow.b,0.7,1);
  rect(img,cx-4,120,cx+12,128,gWeapon.r+8,gWeapon.g+8,gWeapon.b+8,0.7,2);
  ellipse(img,cx-4,124,3,3.5,gGoggle.r,gGoggle.g,gGoggle.b,0.6);
  rect(img,cx-48,131,cx+28,133,gWepLt.r,gWepLt.g,gWepLt.b,0.15);
  rect(img,cx-24,138,cx-18,148,gWeapon.r,gWeapon.g,gWeapon.b,0.7,1);
  // NECK
  trap(img,56,78,cx-10,cx+10,cx-12,cx+12,gMask.r,gMask.g,gMask.b);
  // HEAD/HELMET
  ellipse(img,cx,32,22,24,gDark.r,gDark.g,gDark.b);
  ellipse(img,cx,30,21,23,gMain.r,gMain.g,gMain.b);
  ellipse(img,cx,24,12,14,gLight.r,gLight.g,gLight.b,0.35);
  rect(img,cx-24,40,cx+24,46,gDark.r,gDark.g,gDark.b,0.9,2);
  rect(img,cx-7,6,cx+7,18,gDark.r,gDark.g,gDark.b,0.8,2);
  rect(img,cx-3,2,cx+3,8,shadow.r,shadow.g,shadow.b,0.7,1);
  ellipse(img,cx-4,10,3,4,shadow.r,shadow.g,shadow.b,0.6);
  ellipse(img,cx+4,10,3,4,shadow.r,shadow.g,shadow.b,0.6);
  ellipse(img,cx-22,36,5,8,gDark.r,gDark.g,gDark.b,0.8);
  ellipse(img,cx+22,36,5,8,gDark.r,gDark.g,gDark.b,0.8);
  rect(img,cx-22,22,cx-20,36,gDark.r,gDark.g,gDark.b,0.5);
  rect(img,cx+20,22,cx+22,36,gDark.r,gDark.g,gDark.b,0.5);
  ellipse(img,cx,44,14,10,gMask.r,gMask.g,gMask.b);
  rect(img,cx-15,38,cx+15,46,gGoggle.r,gGoggle.g,gGoggle.b,0.85,3);
  ellipse(img,cx-7,42,5,3,40,45,55,0.6);
  ellipse(img,cx+7,42,5,3,40,45,55,0.6);
  ellipse(img,cx-8,41,2,1.5,80,90,110,0.3);
  ellipse(img,cx+6,41,2,1.5,80,90,110,0.3);
  rect(img,cx-18,18,cx-6,26,gDark.r+10,gDark.g+8,gDark.b+5,0.35,1);
  rect(img,cx+6,18,cx+18,26,gDark.r-5,gDark.g-5,gDark.b-5,0.4,1);
  rect(img,cx+7,19,cx+12,25,gMain.r+20,gMain.g+15,gMain.b+10,0.25);

  ctx.putImageData(img,0,0);
}

// Draw on 1x canvas
const c1 = document.getElementById('c1');
drawSoldier(c1.getContext('2d'));

// Draw on 2x canvas (scaled)
const c2 = document.getElementById('c2');
const ctx2 = c2.getContext('2d');
ctx2.imageSmoothingEnabled = true;
ctx2.drawImage(c1, 0, 0, 320, 800);

// Draw on 0.5x canvas
const c3 = document.getElementById('c3');
drawSoldier(c3.getContext('2d'));
</script>
